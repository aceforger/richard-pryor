<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Deep space navy background -->
  <rect width="100" height="100" rx="16" fill="#07111F"/>
  
  <!-- Cosmic blue inner square -->
  <rect x="8" y="8" width="84" height="84" rx="12" fill="none" stroke="#123A5A" stroke-width="1.5"/>
  
  <!-- Ice cyan outer circle (alien ship / orbit) -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#62D9FF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Earth-like planet -->
  <circle cx="50" cy="50" r="18" fill="#123A5A"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#62D9FF" stroke-width="1"/>
  
  <!-- Continents hints -->
  <path d="M40,42 C45,40 50,42 52,46 C54,50 52,55 48,55 C44,55 40,52 40,48 Z" fill="#62D9FF" opacity="0.3"/>
  
  <!-- Orbit line (ring like Saturn) -->
  <ellipse cx="50" cy="50" rx="36" ry="10" fill="none" stroke="#62D9FF" stroke-width="1.5" transform="rotate(-20 50 50)" opacity="0.7"/>
  
  <!-- Star dots -->
  <circle cx="20" cy="25" r="1.5" fill="#EAF7FF"/>
  <circle cx="80" cy="30" r="1" fill="#62D9FF"/>
  <circle cx="25" cy="75" r="1" fill="#D6B56D"/>
  <circle cx="78" cy="72" r="1.5" fill="#EAF7FF"/>
</svg>